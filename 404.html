<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Newsora</title>
    <script type="text/javascript">
      // Redirect to main site with the path as a query parameter
      var l = window.location;
      var pathSegments = l.pathname.split('/').slice(1);
      var newPath = '/' + pathSegments[0] + '/#/' + pathSegments.slice(1).join('/');
      l.replace(l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') + newPath);
    </script>
  </head>
  <body>
  </body>
</html>
